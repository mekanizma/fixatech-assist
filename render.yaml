# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard'da da aynı komutlar olmalı (Blueprint otomatik uygulanmayabilir):
#   Build: bun install && bun run build
#   Start: bun run start   (= sadece node .output/server/index.mjs — tekrar vite build YAPMA)
services:
  - type: web
    name: pragmatechnical-assist
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BUN_VERSION
        value: "1.3.14"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: HOST
        value: "0.0.0.0"
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
