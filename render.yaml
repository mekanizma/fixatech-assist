# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New > Blueprint > bu repo
services:
  - type: web
    name: fixatech-assist
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
